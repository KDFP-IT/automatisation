# Verify-профиль для строительных работ (ГЭСН).
# Диспетч по имени профиля; ветвлений `if collection ==` в коде нет.
name: building
collection: ГЭСН
checklist:
  - Технология производства работ совпадает с описанием позиции ВОР
  - Тип и характеристики материала (щебень, бетон, грунт и т.д.) соответствуют
  - Состав операций нормы покрывает работы позиции, без двойного учёта соседних позиций
  - Условия выполнения работ (вручную/механизированно, стеснённость) соответствуют
  - Измеритель нормы и правила подсчёта объёма применимы к количеству позиции
stop_conditions:
  - Не указан материал, его марка, диаметр или способ монтажа
  - Неизвестна группа грунта или характеристики техники
  - Одна позиция ВОР покрывается несколькими нормами (требуется разбивка)
  - Норма уже учтена другой позицией ведомости (риск двойного учёта)
