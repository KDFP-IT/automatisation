# Verify-профиль для монтажных работ (ГЭСНм, электрики и смежники).
# Диспетч по имени профиля; ветвлений `if collection ==` в коде нет.
name: montage
collection: ГЭСНм
checklist:
  - Тип и характеристики оборудования соответствуют позиции (напряжение, мощность, масса)
  - Способ монтажа соответствует (прокладка кабеля, установка опор, монтаж щитов и т.д.)
  - Состав операций нормы покрывает работы позиции, без двойного учёта соседних позиций
  - Марка и сечение кабеля/провода, материал конструкций соответствуют
  - Измеритель нормы и правила подсчёта объёма применимы к количеству позиции
stop_conditions:
  - Не указаны напряжение, марка/сечение кабеля или тип оборудования
  - Неизвестен способ прокладки (в земле, в лотках, по конструкциям)
  - Неизвестны высота установки или условия стеснённости
  - Норма уже учтена другой позицией ведомости (риск двойного учёта)
