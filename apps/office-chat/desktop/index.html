<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; base-uri 'none'; form-action 'none'">
  <link rel="stylesheet" href="style.css">
  <script defer src="renderer.js"></script>
  <title>Офисный чат</title>
</head>
<body>
  <svg class="symbols" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <symbol id="i-chat" viewBox="0 0 24 24"><path d="M20 11.5a7.5 7.5 0 0 1-7.5 7.5H5l1.3-3A7.5 7.5 0 1 1 20 11.5Z"/><path d="M9 11.5h7M9 14h4"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="5.5"/><path d="m15 15 4.5 4.5"/></symbol>
    <symbol id="i-people" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3"/><path d="M3.5 19v-2a3.5 3.5 0 0 1 3.5-3.5h4a3.5 3.5 0 0 1 3.5 3.5v2m2-13a3 3 0 0 1 0 6m3.5 7v-2a3.5 3.5 0 0 0-2.5-3.3"/></symbol>
    <symbol id="i-send" viewBox="0 0 24 24"><path d="m4 4 17 8-17 8 3-8-3-8Zm3 8h14"/></symbol>
    <symbol id="i-smile" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M8.5 13.5a4 4 0 0 0 7 0M9 9.5h.01m6 0h.01"/></symbol>
    <symbol id="i-down" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></symbol>
    <symbol id="i-pin" viewBox="0 0 24 24"><path d="m15 3 6 6-3 1-3 3v3l-2 2-7-7 2-2h3l3-3 1-3ZM9 15l-6 6"/></symbol>
    <symbol id="i-exit" viewBox="0 0 24 24"><path d="M11 4H6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h5m4-12 4 4-4 4m-6-4h10"/></symbol>
  </svg>
  <div class="titlebar"><div class="title-mark"><svg><use href="#i-chat"/></svg></div><span>Офисный чат</span></div>
  <div class="workspace">
    <nav class="rail" aria-label="Разделы">
      <div class="brand" title="Офисный чат"><svg><use href="#i-chat"/></svg></div>
      <button class="rail-button active" id="show-chats" title="Переписка" aria-label="Переписка"><svg><use href="#i-chat"/></svg></button>
      <button class="rail-button" id="show-directory" title="Сотрудники" aria-label="Сотрудники"><svg><use href="#i-people"/></svg></button>
      <button class="rail-button rail-exit" id="quit" title="Выйти из приложения" aria-label="Выйти из приложения"><svg><use href="#i-exit"/></svg></button>
    </nav>
    <aside class="sidebar">
      <div class="sidebar-top">
        <div class="eyebrow">РАБОЧЕЕ ПРОСТРАНСТВО</div>
        <div class="sidebar-heading"><h1>Сообщения</h1><span id="online-count" class="badge" hidden></span></div>
        <label class="search"><svg><use href="#i-search"/></svg><input id="search" placeholder="Поиск сотрудника" aria-label="Поиск сотрудника" autocomplete="off"><kbd>Ctrl K</kbd></label>
        <div class="tabs" aria-label="Фильтр сотрудников"><button data-filter="all" class="selected">Все</button><button data-filter="online">В сети</button><button data-filter="unread">Непрочитанные</button></div>
      </div>
      <div class="directory" id="directory" aria-label="Список сотрудников"></div>
      <div class="profile">
        <span id="self-avatar" class="avatar tone-0">Я</span>
        <div class="profile-text"><strong id="self-name">Мой профиль</strong><span id="connection" role="status">Подключение…</span></div>
        <div class="profile-status"><svg><use href="#i-down"/></svg><select id="status" title="Мой статус" aria-label="Мой статус"><option value="online">В сети</option><option value="away">Отошёл</option><option value="busy">Занят</option></select></div>
      </div>
    </aside>
    <main class="chat" aria-label="Личный диалог">
      <header class="chat-header">
        <span id="contact-avatar" class="avatar tone-0"><svg><use href="#i-people"/></svg></span>
        <div class="chat-title"><h2 id="contact-name">Личные сообщения</h2><div id="contact-status" class="subtitle">Рабочее пространство</div></div>
        <div class="private"><svg><use href="#i-pin"/></svg><span>Поверх окон</span></div>
      </header>
      <div class="timeline" id="timeline" aria-label="История сообщений" tabindex="0"></div>
      <div class="compose" id="compose" hidden>
        <div class="emoji-panel" id="emoji-panel" hidden><strong>Быстрые эмодзи</strong><div id="emoji-grid"></div></div>
        <form id="message-form" class="message-form">
          <button type="button" id="emoji-toggle" class="icon-button" aria-label="Выбрать эмодзи" title="Эмодзи" aria-expanded="false"><svg><use href="#i-smile"/></svg></button>
          <textarea id="message" rows="1" aria-label="Сообщение" placeholder="Напишите сообщение…"></textarea>
          <button id="send" class="send" type="submit" aria-label="Отправить" title="Отправить"><svg><use href="#i-send"/></svg></button>
        </form>
        <div class="compose-foot"><span id="send-state" role="status"></span><span><kbd>Enter</kbd> отправить <span class="hint-dot">·</span> <kbd>Shift Enter</kbd> новая строка</span></div>
      </div>
    </main>
  </div>
</body>
</html>
