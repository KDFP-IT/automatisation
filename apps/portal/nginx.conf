worker_processes 2;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    resolver 127.0.0.11 valid=5s ipv6=off;
    server {
        listen 8090;
        absolute_redirect off;
        root /usr/share/nginx/html;
        index index.html;
        client_max_body_size 200m;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 360s;

        location = /api/health {
            default_type application/json;
            return 200 '{"service":"automation-portal","status":"ok"}';
        }
        location = /portal/tools.json {
            alias /etc/portal/catalog/tools.json;
            add_header Cache-Control "no-store" always;
        }
        location / {
            add_header X-Content-Type-Options nosniff always;
            add_header Content-Security-Policy "default-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'" always;
            try_files $uri $uri/ =404;
        }
        include /etc/portal/routes/*.conf;
    }
}
