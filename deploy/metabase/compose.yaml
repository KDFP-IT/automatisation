services:
  metabase:
    image: metabase/metabase:v0.65.3
    restart: unless-stopped
    stop_grace_period: 60s
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    env_file:
      - .env
    ports:
      - "${METABASE_BIND:-127.0.0.1}:${METABASE_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health | grep -q '\"status\":\"ok\"'"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 3m
