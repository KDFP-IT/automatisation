x-service: &service
  pull_policy: never
  restart: unless-stopped
  read_only: true
  tmpfs:
    - /tmp:size=512m,mode=1777
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]

services:
  portal:
    <<: *service
    image: ${PORTAL_IMAGE:-kdfp-portal-shell:1.0.0}
    ports:
      - "${PORTAL_BIND:-127.0.0.1}:${PORTAL_PORT:-8090}:8090"
    volumes:
      - ./catalog:/etc/portal/catalog:ro
      - ./routes:/etc/portal/routes:ro
  bookmarks:
    <<: *service
    image: ${BOOKMARKS_IMAGE:-kdfp-portal-bookmarks:1.0.0}
    environment:
      PDF_WEB_HTTPS: "${PDF_WEB_HTTPS:-0}"
    volumes:
      - bookmarks-data:/data
  signatures:
    <<: *service
    image: ${SIGNATURES_IMAGE:-kdfp-portal-signatures:1.0.0}
  trench:
    <<: *service
    image: ${TRENCH_IMAGE:-kdfp-portal-trench:1.0.0}
    volumes:
      - portal-data:/data
  kac:
    <<: *service
    image: ${KAC_IMAGE:-kdfp-portal-kac:1.0.0}
    environment:
      KAC_WORKER_URL: "${KAC_WORKER_URL:-}"
  auth:
    <<: *service
    image: ${AUTH_IMAGE:-kdfp-portal-auth:1.0.0}
    environment:
      AUTH_OPEN: "${AUTH_OPEN:-0}"
      AUTH_MODE: "${AUTH_MODE:-local}"
      SESSION_SECRET: "${SESSION_SECRET:-}"
      SESSION_TTL_H: "${SESSION_TTL_H:-12}"
      COOKIE_SECURE: "${COOKIE_SECURE:-1}"
      LDAP_URL: "${LDAP_URL:-}"
      LDAP_TLS_MODE: "${LDAP_TLS_MODE:-}"
      LDAP_BASE_DN: "${LDAP_BASE_DN:-}"
      LDAP_DOMAIN: "${LDAP_DOMAIN:-kdfp.ru}"
      LDAP_TIMEOUT_S: "${LDAP_TIMEOUT_S:-5}"
      LDAP_CA_FILE: "${LDAP_CA_FILE:-}"
      LOCAL_LOGIN: "${LOCAL_LOGIN:-}"
      LOCAL_PASSWORD: "${LOCAL_PASSWORD:-}"
    volumes:
      - ./access:/etc/auth:ro
  gesn-match:
    <<: *service
    image: ${GESN_MATCH_IMAGE:-kdfp-portal-gesn-match:1.0.0}
    environment:
      NORMS_DSN: "${NORMS_DSN:-}"
      GESN_TOKEN: "${GESN_TOKEN:-}"
      ROUTER_BASE_URL: "${ROUTER_BASE_URL:-https://routerai.ru/api/v1}"
      ROUTER_API_KEY: "${ROUTER_API_KEY:-}"
      AUDIT_URL: "http://audit:8080"
      HF_HUB_CACHE: "/data/hf-cache"
      HF_HOME: "/data/hf-home"
    volumes:
      - gesn-data:/data
  norms-db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: "${NORMS_DB_USER:-norms}"
      POSTGRES_PASSWORD: "${NORMS_DB_PASSWORD:-}"
      POSTGRES_DB: "${NORMS_DB_NAME:-norms}"
    volumes:
      - norms-data:/var/lib/postgresql/data

volumes:
   portal-data:
   bookmarks-data:
   audit-data:
   gesn-data:
   norms-data:
