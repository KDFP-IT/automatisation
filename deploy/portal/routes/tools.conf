location = /auth/check {
    internal;
    set $auth_check http://auth:8080/auth/check;
    proxy_pass $auth_check;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Cookie $http_cookie;
}

location = /auth/check-bookmarks {
    internal;
    set $auth_check_bookmarks http://auth:8080/auth/check?tool=bookmarks;
    proxy_pass $auth_check_bookmarks;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Cookie $http_cookie;
}

location = /auth/check-signatures {
    internal;
    set $auth_check_signatures http://auth:8080/auth/check?tool=signatures;
    proxy_pass $auth_check_signatures;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Cookie $http_cookie;
}

location = /auth/check-trench {
    internal;
    set $auth_check_trench http://auth:8080/auth/check?tool=trench;
    proxy_pass $auth_check_trench;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Cookie $http_cookie;
}

location = /auth/check-gesn-match {
    internal;
    set $auth_check_gesn_match http://auth:8080/auth/check?tool=gesn-match;
    proxy_pass $auth_check_gesn_match;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Cookie $http_cookie;
}

location = /auth/check-admin {
    internal;
    set $auth_check_admin http://auth:8080/auth/check?tool=_admin;
    proxy_pass $auth_check_admin;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Cookie $http_cookie;
}

location /auth/ {
    set $auth http://auth:8080;
    proxy_pass $auth;
}

# Audit sink: events for any authenticated user, norms only for admins
# (admins pass any ?tool= check, see apps/auth).
location = /audit/norms {
    auth_request /auth/check-admin;
    set $audit http://audit:8080;
    proxy_pass $audit;
}

location /audit/ {
    auth_request /auth/check;
    auth_request_set $auth_user $upstream_http_x_auth_user;
    auth_request_set $auth_name $upstream_http_x_auth_name;
    proxy_set_header X-Auth-User $auth_user;
    proxy_set_header X-Auth-Name $auth_name;
    set $audit http://audit:8080;
    proxy_pass $audit;
}

location = /bookmarks { return 308 /bookmarks/; }
location /bookmarks/ {
    auth_request /auth/check-bookmarks;
    auth_request_set $auth_user $upstream_http_x_auth_user;
    auth_request_set $auth_name $upstream_http_x_auth_name;
    proxy_set_header X-Auth-User $auth_user;
    proxy_set_header X-Auth-Name $auth_name;
    set $bookmarks http://bookmarks:8080;
    proxy_pass $bookmarks;
}

location = /signatures { return 308 /signatures/; }
location /signatures/ {
    auth_request /auth/check-signatures;
    auth_request_set $auth_user $upstream_http_x_auth_user;
    auth_request_set $auth_name $upstream_http_x_auth_name;
    proxy_set_header X-Auth-User $auth_user;
    proxy_set_header X-Auth-Name $auth_name;
    set $signatures http://signatures:8080;
    rewrite ^/signatures(/.*)$ $1 break;
    proxy_pass $signatures;
}

location = /trench { return 308 /trench/; }
location /trench/ {
    # Local proxy_set_header directives override the server-level header set.
    # Preserve the browser-facing host for the API's same-origin check.
    proxy_set_header Host $http_host;
    auth_request /auth/check-trench;
    auth_request_set $auth_user $upstream_http_x_auth_user;
    auth_request_set $auth_name $upstream_http_x_auth_name;
    proxy_set_header X-Auth-User $auth_user;
    proxy_set_header X-Auth-Name $auth_name;
    set $trench http://trench:8080;
    proxy_pass $trench;
}

location = /kac { return 308 /kac/; }
location /kac/ {
    auth_request /auth/check-kac;
    auth_request_set $auth_user $upstream_http_x_auth_user;
    auth_request_set $auth_name $upstream_http_x_auth_name;
    proxy_set_header X-Auth-User $auth_user;
    proxy_set_header X-Auth-Name $auth_name;
    set $kac http://kac:8080;
    proxy_pass $kac;
}

location = /gesn-match { return 308 /gesn-match/; }
location /gesn-match/ {
    auth_request /auth/check-gesn-match;
    auth_request_set $auth_user $upstream_http_x_auth_user;
    auth_request_set $auth_name $upstream_http_x_auth_name;
    proxy_set_header X-Auth-User $auth_user;
    proxy_set_header X-Auth-Name $auth_name;
    set $gesn_match http://gesn-match:8080;
    proxy_pass $gesn_match;
}
