location = /auth/check {
    internal;
    set $auth http://auth:8080;
    proxy_pass $auth;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Cookie $http_cookie;
}

location /auth/ {
    set $auth http://auth:8080;
    proxy_pass $auth;
}

# Audit sink: events for any authenticated user, norms only for admins
# (admins pass any ?tool= check, see apps/auth).
location = /audit/norms {
    auth_request /auth/check?tool=_admin;
    set $audit http://audit:8080;
    proxy_pass $audit;
}

location /audit/ {
    auth_request /auth/check;
    auth_request_set $auth_user $upstream_http_x_auth_user;
    proxy_set_header X-Auth-User $auth_user;
    set $audit http://audit:8080;
    proxy_pass $audit;
}

location = /bookmarks { return 308 /bookmarks/; }
location /bookmarks/ {
    auth_request /auth/check?tool=bookmarks;
    auth_request_set $auth_user $upstream_http_x_auth_user;
    proxy_set_header X-Auth-User $auth_user;
    set $bookmarks http://bookmarks:8080;
    proxy_pass $bookmarks;
}

location = /signatures { return 308 /signatures/; }
location /signatures/ {
    auth_request /auth/check?tool=signatures;
    auth_request_set $auth_user $upstream_http_x_auth_user;
    proxy_set_header X-Auth-User $auth_user;
    set $signatures http://signatures:8080;
    rewrite ^/signatures(/.*)$ $1 break;
    proxy_pass $signatures;
}

location = /trench { return 308 /trench/; }
location /trench/ {
    auth_request /auth/check?tool=trench;
    auth_request_set $auth_user $upstream_http_x_auth_user;
    proxy_set_header X-Auth-User $auth_user;
    set $trench http://trench:8080;
    proxy_pass $trench;
}

location = /kac { return 308 /kac/; }
location /kac/ {
    auth_request /auth/check?tool=kac;
    auth_request_set $auth_user $upstream_http_x_auth_user;
    proxy_set_header X-Auth-User $auth_user;
    set $kac http://kac:8080;
    proxy_pass $kac;
}
